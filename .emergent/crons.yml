crons:
  - name: daily-summary
    description: "Envía a Camila el resumen de ventas del día anterior a las 7:00 AM Argentina"
    cron: "0 7 * * *"
    timezone: "America/Argentina/Buenos_Aires"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-summary"
    method: POST
    enabled: true
